  <style>
    :root {
      color-scheme: light;
      --ink: #17314d;
      --muted: #53677c;
      --pink: #d9902f;
      --green: #08bf78;
      --surface: rgba(255, 252, 244, 0.82);
      --shadow: 0 18px 42px rgba(23, 49, 77, 0.13);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #f6efdf;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    button, a { font: inherit; }

    .page {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: url("study-map-background.png") center / cover no-repeat;
    }

    .page::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: rgba(255, 252, 244, 0.38);
    }

    .site-header {
      height: 106px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(26px, 4vw, 44px);
      border-bottom: 1px solid rgba(23, 49, 77, 0.09);
      background: rgba(255, 252, 244, 0.38);
      backdrop-filter: blur(8px) saturate(120%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      color: var(--ink);
      text-decoration: none;
      font-size: 23px;
      font-weight: 800;
      white-space: nowrap;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #244765;
      box-shadow: 0 10px 24px rgba(36, 71, 101, 0.2);
    }

    .brand-logo-character {
      color: #fff;
      font-family: "Songti SC", SimSun, serif;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .login-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 24px;
      padding: 0 18px;
      color: #fff;
      background: var(--green);
      box-shadow: 0 12px 26px rgba(8, 191, 120, 0.25);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .login-button:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(8, 191, 120, 0.3); }
    .login-button:focus-visible, .subject-card:focus-visible, .dialog-close:focus-visible { outline: 3px solid rgba(69, 94, 246, 0.28); outline-offset: 3px; }
    .wechat-icon { font-size: 18px; line-height: 1; }

    main {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 24px 70px;
    }

    .hero {
      width: min(1056px, 100%);
      text-align: center;
      transform: translateY(12px);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .eyebrow { margin: 0 0 18px; color: var(--pink); font-size: 15px; font-weight: 700; }
    h1 {
      margin: 0;
      font-size: clamp(40px, 4.25vw, 58px);
      line-height: 1.18;
      letter-spacing: 0;
      font-weight: 850;
    }

    .subtitle { margin: 16px 0 45px; color: var(--muted); font-size: 18px; }
    .section-title { margin: 0 0 20px; font-size: 20px; line-height: 1.4; }

    .subject-grid {
      display: grid;
      grid-template-columns: 1.2fr repeat(4, 1fr);
      gap: 18px;
      align-items: center;
    }

    .subject-card {
      position: relative;
      min-width: 0;
      height: 162px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(23, 49, 77, 0.1);
      border-radius: 8px;
      padding: 18px 12px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px) saturate(115%);
      text-decoration: none;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .subject-card:hover { transform: translateY(-4px); box-shadow: 0 22px 46px rgba(23, 49, 77, 0.18); }
    .subject-card.is-disabled {
      cursor: default;
      box-shadow: 0 12px 28px rgba(23, 49, 77, 0.1);
    }
    .subject-card.is-disabled:hover { transform: none; box-shadow: 0 12px 28px rgba(23, 49, 77, 0.1); }
    .subject-card[hidden] { display: none !important; }
    .subject-card.active { height: 186px; border-color: var(--pink); box-shadow: 0 22px 45px rgba(217, 144, 47, 0.2); }

    .subject-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin-bottom: 14px;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
      font-size: 23px;
      font-weight: 800;
      line-height: 1;
    }

    .subject-card h3 { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 800; white-space: nowrap; }
    .subject-card.active h3 { font-size: 20px; }
    .subject-card p { margin: 12px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; white-space: nowrap; }

    .hot-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 7px;
      border-radius: 10px;
      color: #fff;
      background: var(--pink);
      font-size: 11px;
      line-height: 1;
    }

    .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 7px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255, 252, 244, 0.94);
      font-size: 11px;
      line-height: 1;
    }

    footer {
      min-height: 67px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px 18px;
      color: #a0a4bd;
      font-size: 11px;
      text-align: center;
      border-top: 1px solid rgba(23, 49, 77, 0.08);
      background: rgba(255, 252, 244, 0.38);
      backdrop-filter: blur(8px) saturate(120%);
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--pink); }
    .footer-links, .filings { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; }

    dialog {
      width: min(390px, calc(100% - 32px));
      border: 0;
      border-radius: 8px;
      padding: 28px;
      color: var(--ink);
      box-shadow: 0 25px 70px rgba(28, 29, 54, 0.24);
      text-align: center;
    }
    dialog::backdrop { background: rgba(23, 24, 45, 0.35); backdrop-filter: blur(4px); }
    dialog h2 { margin: 0 0 10px; font-size: 21px; }
    dialog p { margin: 0 0 22px; color: var(--muted); line-height: 1.7; }
    .dialog-close {
      min-width: 104px;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: var(--ink);
      cursor: pointer;
    }

    @media (max-width: 920px) {
      .site-header { height: 88px; }
      main { align-items: flex-start; padding-top: 50px; }
      .hero { transform: none; }
      .subject-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .subject-card, .subject-card.active { height: 166px; }
      .subject-card.active { grid-column: 1 / -1; }
    }

    @media (min-width: 1400px) {
      main { padding: 50px 48px 110px; }
      .hero { width: min(1900px, 92vw); }
      .eyebrow { margin-bottom: 30px; font-size: 28px; }
      h1 { font-size: clamp(82px, 4.3vw, 108px); }
      .subtitle { margin: 28px 0 68px; font-size: 32px; }
      .section-title { margin-bottom: 34px; font-size: 32px; }
      .subject-grid { gap: 30px; }
      .subject-card { height: 280px; padding: 30px 20px; }
      .subject-card.active { height: 320px; }
      .subject-icon { width: 88px; height: 88px; margin-bottom: 24px; font-size: 37px; }
      .subject-card h3 { font-size: 26px; }
      .subject-card.active h3 { font-size: 32px; }
      .subject-card p { margin-top: 18px; font-size: 18px; }
      .hot-badge, .status-badge { top: 20px; right: 20px; padding: 7px 11px; border-radius: 16px; font-size: 16px; }
    }

    @media (max-width: 560px) {
      .site-header { padding: 0 18px; }
      .brand { gap: 9px; font-size: 19px; }
      .brand-mark { width: 36px; height: 36px; }
      .login-button { width: 44px; padding: 0; }
      .login-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      main { padding: 30px 16px 55px; }
      .eyebrow { margin-bottom: 13px; }
      h1 { font-size: 38px; }
      .subtitle { margin: 14px auto 34px; font-size: 15px; }
      .section-title { font-size: 18px; }
      .subject-grid { gap: 12px; }
      .subject-card, .subject-card.active { height: 155px; padding: 15px 8px; }
      .subject-icon { width: 48px; height: 48px; margin-bottom: 11px; }
      .subject-card h3, .subject-card.active h3 { font-size: 15px; }
      .subject-card p { max-width: 100%; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
      .hot-badge, .status-badge { top: 9px; right: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>

</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="大华舅舅首页">
        <span class="brand-mark" aria-hidden="true"><span class="brand-logo-character">舅</span></span>
        <span>大华舅舅</span>
      </a>
      <button class="login-button" type="button" data-dialog-title="微信登录" data-dialog-copy="微信登录正在接入，敬请期待。">
        <span class="wechat-icon" aria-hidden="true">●●</span>
        <span class="login-label">微信一键登录</span>
      </button>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">看不懂去抖音给我留言，找“文科博士”</p>
        <h1 id="page-title">多看几遍就会了</h1>
        <p class="subtitle">选择学科 · 全是难点 · 自学神器</p>
        <h2 class="section-title">选择你痛苦的学科</h2>
        <div class="subject-grid">
          <a class="subject-card active" style="--accent:#d99a35" href="english.html">
            <span class="hot-badge">热门</span>
            <span class="subject-icon" aria-hidden="true">▯</span>
            <h3>英语单词</h3>
            <p>批量记单词，高效学英语</p>
          </a>
          <a class="subject-card" style="--accent:#4564f6" href="math.html" aria-label="进入数学难点讲解">
            <span class="status-badge">新页面</span>
            <span class="subject-icon" aria-hidden="true">∑</span><h3>数学难点讲解</h3><p>按年级查知识点和讲题</p>

          </a>
          <button class="subject-card is-disabled" style="--accent:#06cda4" type="button" disabled hidden aria-label="化学难点讲解，即将上线">
            <span class="status-badge">即将上线</span>
            <span class="subject-icon" aria-hidden="true">⚗</span><h3>化学难点讲解</h3><p>反应不再难，实验直观</p>
          </button>
          <a class="subject-card" style="--accent:#9854e6" href="chinese.html" aria-label="进入语文学习模块">
            <span class="status-badge">新页面</span>
            <span class="subject-icon" aria-hidden="true">文</span><h3>语文</h3><p>文言文、阅读理解与积累</p>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <a href="https://dahuajiujiu.com/">dahuajiujiu.com</a>
      <nav class="footer-links" aria-label="网站信息">
        <a href="about.html">关于与联系</a>
        <a href="privacy.html">隐私政策</a>
        <a href="terms.html">用户协议</a>
      </nav>
      <div class="filings">
        <a href="https://beian.miit.gov.cn/" rel="noopener" target="_blank">京ICP备2026041766号-1</a>
        <a href="https://beian.mps.gov.cn/#/query/webSearch?code=11010502061795" rel="noopener" target="_blank">京公网安备11010502061795号</a>
      </div>
    </footer>
  </div>

  <dialog id="status-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">即将开放</h2>
    <p id="dialog-copy">这一学科正在认真准备中，敬请期待。</p>
    <button class="dialog-close" type="button">知道了</button>
  </dialog>

  <script>
    const dialog = document.getElementById('status-dialog');
    const dialogTitle = document.getElementById('dialog-title');
    const dialogCopy = document.getElementById('dialog-copy');
    document.querySelectorAll('[data-dialog-title]').forEach((button) => {
      button.addEventListener('click', () => {
        dialogTitle.textContent = button.dataset.dialogTitle;
        dialogCopy.textContent = button.dataset.dialogCopy || '这一学科正在认真准备中，敬请期待。';
        dialog.showModal();
      });
    });
    dialog.querySelector('.dialog-close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
  </script>
  <script src="account-sync.js?v=1.0.1" defer></script>
</body>

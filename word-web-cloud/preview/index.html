<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预览跳转中</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
            color: #163247;
            padding: 24px;
        }

        .card {
            width: min(560px, 100%);
            background: #fff;
            border: 1px solid #d7e3ec;
            border-radius: 24px;
            padding: 28px 24px;
            box-shadow: 0 18px 40px -24px rgba(9, 34, 51, 0.28);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #4a6477;
        }

        a {
            color: #1b5f91;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>正在跳转到预览站</h1>
        <p>如果没有自动跳转，请打开 <a id="preview-link" href="http://47.93.254.74:5000/">预览地址</a>。</p>
    </div>
    <script>
        (function () {
            var target = 'http://47.93.254.74:5000/';
            var finalTarget = target + window.location.search + window.location.hash;
            document.getElementById('preview-link').href = finalTarget;
            window.location.replace(finalTarget);
        })();
    </script>
</body>
</html>

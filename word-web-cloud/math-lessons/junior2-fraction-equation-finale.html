<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互为相反数的分式方程 · 初二上压轴题</title><meta name="description" content="八年级上册分式方程综合题，先识别相反数关系，再去分母并检验。"><link rel="stylesheet" href="junior1-finale-common.css"></head><body><main class="wrap"><nav class="nav"><a class="brand" href="../index.html">∑ 大华舅舅的资料</a><a class="back" href="../math.html?grade=junior2&topic=fractions">← 返回初二目录</a></nav><header class="hero"><h1>互为相反数的分式方程</h1><p>初二上 · 分式 · 题目 05</p><span class="pill">分式方程</span><span class="pill">相反数</span><span class="pill">检验</span></header><section class="card"><h2>题目</h2><div class="problem"><p>解方程：</p><div class="formula">3/(x−2) − 1/(2−x) = 2</div></div></section><section class="card figure-card"><h2>题目示意图</h2><svg class="lesson-figure" viewBox="0 0 720 300" role="img" aria-label="先把 2−x 变成 −(x−2)，再合并同类分式"><rect class="panel" x="45" y="45" width="265" height="190" rx="12"/><text x="82" y="100">2−x=−(x−2)</text><text x="74" y="160">1/(2−x)</text><text x="170" y="205">↓</text><text x="75" y="225">−1/(x−2)</text><path class="goal" d="M310 140H410"/><rect x="410" y="45" width="265" height="190" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/><text x="455" y="105">4/(x−2)=2</text><text x="490" y="160">x=4</text><text class="small" x="450" y="210">检验：x≠2，原式成立</text></svg><p class="figure-caption">先把 2−x 变成 −(x−2)，再合并同类分式</p></section><section class="card"><h2>解答</h2><div class="steps"><div class="step"><h3>写取值限制</h3><div class="formula">x≠2</div></div><div class="step"><h3>识别相反数</h3><div class="formula">2−x=−(x−2)，所以 1/(2−x)=−1/(x−2)</div></div><div class="step"><h3>合并并解方程</h3><div class="formula">4/(x−2)=2<br>4=2(x−2)<br>x=4</div></div><div class="step"><h3>检验</h3><p>x=4 不使分母为 0。代入原式：3/2−1/(−2)=2，成立。</p></div></div><div class="answer">答案：x=4。先看出两个分母互为相反数，可以显著减少符号错误。</div></section><footer class="footer">八年级上册压轴题 · 讲解页</footer></main></body></html>

name: Deploy private Wenan workspace

on:
  push:
    branches: [main]
    paths: ['.github/services/wenan/sync-bootstrap.sha256']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, deploy, sync-bootstrap]
        default: deploy
      upload_fingerprint:
        type: string
        description: SHA-256 fingerprint for the independent private update key
        required: false

permissions:
  contents: read

concurrency:
  group: aliyun-production
  cancel-in-progress: false

jobs:
  private-workspace:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.ALIYUN_SSH_HOST }}
      SSH_USER: ${{ secrets.ALIYUN_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/services/wenan
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
      - name: Verify the cached host identity
        env:
          HOST_IDENTITY: ${{ secrets.WENAN_KNOWN_HOST }}
        run: |
          test -n "$HOST_IDENTITY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOST_IDENTITY" > ~/.ssh/known_hosts
          printf 'Host *\n  HostKeyAlias wenan-production\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts
      - name: Check production prerequisites
        if: inputs.mode == 'probe'
        run: |
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          printf 'uid='; id -u
          if sudo -n true 2>/dev/null; then echo sudo=yes; fi
          printf 'python='; python3 --version
          printf 'caddy='; caddy version
          for unit in caddy caddy-api; do
            printf '%s: ' "$unit"
            systemctl is-active "$unit" || true
            if systemctl is-active --quiet "$unit"; then
              systemctl show "$unit" -p ExecStart --value | sed -nE 's/.*(\/etc\/caddy\/[^ ;]+).*/config=\1/p'
              if systemctl show "$unit" -p ExecStart --value | grep -q -- --resume; then echo resume=yes; fi
            fi
          done
          if curl -fsS http://127.0.0.1:2019/config/apps/http/servers >/dev/null; then echo caddy-admin=yes; fi
          if ss -ltn | awk '{print $4}' | grep -Eq ':3017$'; then echo port3017=in-use; else echo port3017=free; fi
          REMOTE
      - name: Stage private content
        if: inputs.mode == 'deploy'
        env:
          PAYLOAD_1: ${{ secrets.WENAN_RELEASE_1 }}
          PAYLOAD_2: ${{ secrets.WENAN_RELEASE_2 }}
          PAYLOAD_3: ${{ secrets.WENAN_RELEASE_3 }}
          PAYLOAD_4: ${{ secrets.WENAN_RELEASE_4 }}
          PAYLOAD_5: ${{ secrets.WENAN_RELEASE_5 }}
          PAYLOAD_6: ${{ secrets.WENAN_RELEASE_6 }}
          PAYLOAD_7: ${{ secrets.WENAN_RELEASE_7 }}
          PAYLOAD_8: ${{ secrets.WENAN_RELEASE_8 }}
          PAYLOAD_9: ${{ secrets.WENAN_RELEASE_9 }}
          PAYLOAD_10: ${{ secrets.WENAN_RELEASE_10 }}
          PAYLOAD_11: ${{ secrets.WENAN_RELEASE_11 }}
          PAYLOAD_12: ${{ secrets.WENAN_RELEASE_12 }}
          PAYLOAD_PARTS: ${{ secrets.WENAN_RELEASE_PARTS }}
        run: |
          umask 077
          test -n "$PAYLOAD_1"
          [[ "$PAYLOAD_PARTS" =~ ^parts:([1-9]|1[0-2])$ ]]
          part_count="${PAYLOAD_PARTS#parts:}"
          mkdir "$RUNNER_TEMP/wenan-release"
          for ((i=1; i<=part_count; i++)); do
            name="PAYLOAD_$i"
            test -n "${!name}"
            printf '%s' "${!name}"
          done | base64 --decode > "$RUNNER_TEMP/wenan-release/private.tgz"
          gzip -t "$RUNNER_TEMP/wenan-release/private.tgz"
          cp .github/services/wenan/{server,install}.py "$RUNNER_TEMP/wenan-release/"
          tar -czf "$RUNNER_TEMP/wenan-deploy.tgz" -C "$RUNNER_TEMP/wenan-release" .
      - name: Install the isolated private service
        if: inputs.mode == 'deploy'
        run: |
          release="/tmp/wenan-${{ github.run_id }}-${{ github.run_attempt }}.tgz"
          scp -o BatchMode=yes "$RUNNER_TEMP/wenan-deploy.tgz" "$SSH_USER@$SSH_HOST:$release"
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "RELEASE='$release' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"; rm -f -- "$RELEASE"' EXIT
          tar -xzf "$RELEASE" -C "$stage"
          if test "$(id -u)" -eq 0; then
            python3 "$stage/install.py" "$stage"
          else
            sudo -n python3 "$stage/install.py" "$stage"
          fi
          REMOTE
      - name: Install only private updater code
        if: inputs.mode == 'sync-bootstrap' || github.event_name == 'push'
        env:
          UPLOAD_FINGERPRINT: ${{ inputs.upload_fingerprint }}
        run: |
          if test "$GITHUB_EVENT_NAME" = push; then
            UPLOAD_FINGERPRINT=$(tr -d '\r\n' < .github/services/wenan/sync-bootstrap.sha256)
          fi
          [[ "$UPLOAD_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]
          umask 077
          tar -czf "$RUNNER_TEMP/wenan-code.tgz" -C .github/services/wenan server.py install.py compass-template.html
          release="/tmp/wenan-code-${{ github.run_id }}-${{ github.run_attempt }}.tgz"
          scp -o BatchMode=yes "$RUNNER_TEMP/wenan-code.tgz" "$SSH_USER@$SSH_HOST:$release"
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" "RELEASE='$release' FINGERPRINT='$UPLOAD_FINGERPRINT' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          stage=$(mktemp -d)
          trap 'rm -rf -- "$stage"; rm -f -- "$RELEASE"' EXIT
          tar -xzf "$RELEASE" -C "$stage"
          if test "$(id -u)" -eq 0; then
            python3 "$stage/install.py" --sync-bootstrap "$stage" "$FINGERPRINT"
          else
            sudo -n python3 "$stage/install.py" --sync-bootstrap "$stage" "$FINGERPRINT"
          fi
          REMOTE
      - name: Verify public boundary
        if: inputs.mode == 'deploy' || inputs.mode == 'sync-bootstrap' || github.event_name == 'push'
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://dahuajiujiu.com/)" = 200
          curl -fsS --max-time 20 https://dahuajiujiu.com/wenan > "$RUNNER_TEMP/locked.html"
          grep -q 'data-wenan-locked' "$RUNNER_TEMP/locked.html"
          ! grep -q 'dc-embedded' "$RUNNER_TEMP/locked.html"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://dahuajiujiu.com/wenan/compass.html)" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'https://dahuajiujiu.com/wenan/transcript?id=7683699921954261364')" = 403
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST 'https://dahuajiujiu.com/wenan/_sync')" = 404
